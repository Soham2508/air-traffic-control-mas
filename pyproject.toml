[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-mas"
version = "0.1.0"
description = "Simulated Air Traffic Control Conflict Detection and Resolution Multi-Agent System"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.7.0",
    "crewai>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
atc-mas = "atc_mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["atc_mas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

